name: Verify latest Turso backup

on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turso-production-backup-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backup
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install pinned backup dependencies
        working-directory: backend
        run: npm ci
      - name: Download, decrypt, reconstruct, and verify
        working-directory: backend
        run: npm run backup:turso:verify
